id: https://autothing.dev/ontology/core
name: autothing-core
title: Ядро онтологии autothing
description: >-
  Восемь базовых категорий из core-categories.md и решения по итогам прогонов.
  Только решённое; открытые вопросы — в core-categories.md, не здесь.
version: 0.0.1
license: TBD

prefixes:
  linkml: https://w3id.org/linkml/
  at: https://autothing.dev/ontology/core/
default_prefix: at
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------- миксины

classes:

  Identified:
    title: Идентифицируемость
    description: >-
      Глобальный ID autothing + внешние идентификаторы с источником и валидностью.
      Сквозная способность всех категорий, не категория (решение 2026-10-11).
    mixin: true
    slots:
      - id
      - name
      - identifiers

  TemporalExtent:
    title: Протяжённость во времени
    description: >-
      Интервал валидности и события, которые его открыли и закрыли (решение Р2).
      Открытый конец — valid_to пуст.
    mixin: true
    slots:
      - valid_from
      - valid_to
      - started_by
      - ended_by

# ---------------------------------------------------------------- категории

  Item:
    title: Объект
    description: >-
      Физическая или логическая вещь, которой владеют, которую обслуживают и могут заменить.
      Первый уровень специализации — item_kind: устройство / соединение / несущая конструкция / совокупность / программный компонент.
      Совокупность (группа, подсистема) — логический объект; членство — Relation member_of (решение 2026-10-11).
    mixins: [Identified, TemporalExtent]
    slots:
      - type
      - item_kind
      - functional_domain
      - phases

  Location:
    title: Место
    description: Где объект находится. Иерархично — место содержит места.
    mixins: [Identified, TemporalExtent]
    slots:
      - type

  Party:
    title: Субъект
    description: Тот, кто владеет, эксплуатирует, обслуживает, отвечает. Только идентичность и контакты.
    mixins: [Identified, TemporalExtent]

  Relation:
    title: Связь
    description: >-
      Типизированное отношение между экземплярами категорий с интервалом валидности.
      Полноценная сущность: интервал, событие-источник, основание.
      Одна механика, пять семейств (family); вид связи — Type с applies_to: relation,
      задаёт семейство и схему атрибутов (решение 2026-10-11). RelationKind — базовый перечень ядра.
    mixins: [Identified, TemporalExtent]
    slots:
      - kind
      - family
      - subject
      - object
      - subject_port
      - object_port
      - medium
      - carrier
      - basis
    slot_usage:
      kind:
        required: true
      family:
        required: true
      subject:
        required: true
      object:
        required: true

  ConnectionPoint:
    title: Точка подключения
    description: >-
      Элемент Объекта: клемма, патрубок, канал контроллера, выход. Не объект — идентичность = родитель + обозначение.
      Концы потоковых связей и связей данных. Ср. s223:ConnectionPoint (решение 2026-10-11, предварительно).
    mixins: [TemporalExtent]
    slots:
      - of
      - designation
      - medium
    slot_usage:
      of:
        required: true
      designation:
        required: true

  DataPoint:
    title: Точка данных
    description: Измеряемая или управляемая величина. Принадлежит объекту или месту (решение Р5), не каналу контроллера.
    mixins: [Identified, TemporalExtent]
    slots:
      - type
      - owner

  Event:
    title: Событие
    description: >-
      То, что произошло в момент или интервал. Мгновенное — valid_to = valid_from.
      Порождает изменения связей (Р2). Факт, а не основание — основания см. Document.
    mixins: [Identified, TemporalExtent]
    slots:
      - type
      - participants
      - attachments

  Type:
    title: Тип
    description: Класс объектов, точек данных, мест, событий, документов. Граница с мастер-данными — справочник типов.
    mixins: [Identified]
    slots:
      - applies_to
      - functional_domain

  Document:
    title: Документ
    description: >-
      Формальная запись между субъектами со статусом, служащая основанием для изменений в модели
      (решение 2026-10-11; пересмотр Р3 и Р6). Наряд, заявка, договор, акт — специализации через type.
      Файл — не документ, а вложение.
    mixins: [Identified, TemporalExtent]
    slots:
      - type
      - status
      - parties
      - concerns
      - attachments
    slot_usage:
      status:
        required: true

# ---------------------------------------------------------------- вспомогательные

  Identifier:
    title: Внешний идентификатор
    description: >-
      Внешний или производный идентификатор с системой-источником и валидностью (Ш6 прогона С5).
      Вспомогательная сущность внутри Identified, не категория.
    mixins: [TemporalExtent]
    slots:
      - value
      - system
    slot_usage:
      value:
        required: true
      system:
        required: true

  PhaseInterval:
    title: Фаза жизненного цикла с интервалом
    description: Фаза — состояние объекта с интервалом (решение Р4).
    mixins: [TemporalExtent]
    slots:
      - phase
    slot_usage:
      phase:
        required: true

  Attachment:
    title: Вложение
    description: Файл-свидетельство События или Документа (решение Р3, уточнено 2026-10-11). Не категория.
    slots:
      - uri
      - hash
      - attached_by

# ---------------------------------------------------------------- слоты

slots:
  id:
    identifier: true
    range: uriorcurie
    description: Глобальный ID autothing. Не меняется и не переиспользуется.
  name:
    title: Название
  valid_from:
    range: datetime
    required: true
  valid_to:
    range: datetime
  started_by:
    range: Event
    description: Событие, открывшее интервал.
  ended_by:
    range: Event
    description: Событие, закрывшее интервал.
  type:
    range: Type
  item_kind:
    range: ItemKind
    description: Первый уровень специализации Объекта.
  functional_domain:
    range: FunctionalDomain
    description: >-
      Функциональная область. У Типа — умолчание для фильтров (светильник → освещение);
      у Объекта-совокупности — делает её Подсистемой («ИТП-2 здания 5»). Членство экземпляра в системе — через member_of.
  phases:
    range: PhaseInterval
    multivalued: true
    inlined_as_list: true
  kind:
    range: RelationKind
  family:
    range: RelationFamily
    description: Семейство связи; задаёт форму — обязательные атрибуты и правила кардинальности.
  subject:
    range: Identified
    description: От кого связь (объект, место, субъект, точка данных).
  object:
    range: Identified
    description: К кому связь.
  subject_port:
    range: ConnectionPoint
    description: Точка подключения на стороне subject (потоковые связи и связи данных).
  object_port:
    range: ConnectionPoint
    description: Точка подключения на стороне object.
  medium:
    range: Medium
    description: Среда потоковой связи или точки подключения.
  carrier:
    range: Item
    description: Носитель потоковой связи — объект-соединение (кабель, труба, шина). Связь может существовать без носителя.
  of:
    range: Item
    description: Объект, которому принадлежит точка подключения.
  designation:
    description: Обозначение на объекте — X1:3, DA+, патрубок 2.
  basis:
    range: Document
    description: Основание связи — договор, акт, наряд (Р6, пересмотрено 2026-10-11).
  owner:
    range: Identified
    description: Объект или Место, которому принадлежит точка данных.
  participants:
    range: Identified
    multivalued: true
  attachments:
    range: Attachment
    multivalued: true
    inlined_as_list: true
  applies_to:
    range: CategoryKind
    description: К какой категории относится тип.
  value:
    description: Значение идентификатора в системе-источнике.
  system:
    description: Система-источник или правило вывода.
  identifiers:
    range: Identifier
    multivalued: true
    inlined_as_list: true
    description: Внешние идентификаторы экземпляра.
  status:
    range: DocumentStatus
  parties:
    range: Party
    multivalued: true
    description: Стороны документа (выдал, принял, подписал). Роли сторон — через Relation.
  concerns:
    range: Identified
    multivalued: true
    description: Объекты, места, субъекты, к которым относится документ.
  phase:
    range: LifecyclePhase
  uri:
    range: uri
  hash:
  attached_by:
    range: Party

# ---------------------------------------------------------------- перечисления

enums:

  CategoryKind:
    title: Категория
    permissible_values:
      asset:
      location:
      party:
      data_point:
      event:
      document:
      relation:
        description: "Вид связи — тоже Тип: задаёт семейство и схему атрибутов (решение 2026-10-11)."

  RelationFamily:
    title: Семейство связи
    permissible_values:
      structural:
        title: структурная
        description: часть, входит в, расположен в, смонтирован на. У «часть» и «расположен в» — один родитель в момент времени.
      flow:
        title: потоковая
        description: питается от, подключён к, подача среды. Среда, направление, точки подключения, носитель.
      responsibility:
        title: ответственность
        description: владеет, эксплуатирует, обслуживает, гарантирует. Роль, основание-документ, доля.
      data:
        title: данных
        description: измеряет, управляет. Адрес (DALI, Modbus-регистр), направление.
      lifecycle:
        title: жизненного цикла
        description: реализует, заменяет.

  Medium:
    title: Среда
    description: Открытый список; ср. s223:Medium.
    permissible_values:
      electricity:
        title: электричество
      water:
        title: вода
      heat_carrier:
        title: теплоноситель
      air:
        title: воздух
      gas:
        title: газ
      data:
        title: данные
        description: DALI, Modbus, KNX, BACnet, Ethernet — протокол уточняется атрибутом.

  ItemKind:
    title: Вид объекта
    description: Первый уровень специализации Объекта (PRD Заказчик 2 + решение 2026-10-11).
    permissible_values:
      device:
        title: устройство
      connection:
        title: соединение
        description: Кабель, линия, оптоволокно, труба, воздуховод — носитель связи.
      structure:
        title: несущая конструкция
        description: Опора, эстакада, кронштейн.
      collection:
        title: совокупность
        description: Группа, подсистема. Логический объект; члены — через member_of.
      software:
        title: программный компонент
        description: >-
          Прошивка, сервис, виртуальный шлюз, драйвер протокола, поток Node-RED.
          Устанавливается, версионируется, заменяется; имеет владельца и лицензию (решение 2026-10-11).

  FunctionalDomain:
    title: Функциональная область
    description: Открытый список; расширяется вертикалями.
    permissible_values:
      lighting:
        title: освещение
      power:
        title: электроснабжение
      hvac:
        title: вентиляция и климат
      heating:
        title: теплоснабжение
      water:
        title: водоснабжение и канализация
      security:
        title: безопасность (ОПС, СКУД, видео)
      transport:
        title: вертикальный транспорт

  DocumentStatus:
    title: Статус документа
    description: Общий жизненный цикл; специализации (наряд, договор) уточняют через Type.
    permissible_values:
      draft:
        title: черновик
      issued:
        title: выдан
      accepted:
        title: принят
      done:
        title: исполнен
      closed:
        title: закрыт
      cancelled:
        title: аннулирован

  LifecyclePhase:
    title: Фаза жизненного цикла объекта
    description: Решение Р4. Склад — Место, не фаза.
    permissible_values:
      planned:
        title: проект
      realized:
        title: реализован
        description: Терминальная фаза проектного объекта.
      installed:
        title: смонтирован
      in_operation:
        title: в эксплуатации
      decommissioned:
        title: выведен
      disposed:
        title: утилизирован

  RelationKind:
    title: Тип связи
    description: Основные типы из core-categories.md и прогона С5. Расширяются вертикалями.
    permissible_values:
      part_of:
        title: часть
        description: Физический состав. Дерево; замена части не меняет целое.
      member_of:
        title: входит в
        description: Логическое членство в совокупности (группа, подсистема). Многие-ко-многим (решение 2026-10-11).
      located_in:
        title: расположен в
      mounted_on:
        title: смонтирован на
      powered_by:
        title: питается от
      connected_to:
        title: подключён к
      owns:
        title: владеет
      operates:
        title: эксплуатирует
      services:
        title: обслуживает
      guarantees:
        title: гарантирует
      measures:
        title: измеряет
      controls:
        title: управляет
      realizes:
        title: реализует
        description: Фактический объект реализует проектный (Р1).
      replaces:
        title: заменяет
